name: Test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    strategy:
      matrix:
        channel: [stable, beta]

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib/
      - run: dart analyze
    #   - run: dart test
      - run: dart doc
      - name: Upload generated dartdoc
        uses: actions/upload-artifact@v5
        with:
          name: docs-${{ matrix.channel }}
          path: doc/
      - name: Evaluate score with pana
        run: |
          dart pub global activate pana
          dart pub global run pana .

  android-native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: ./gradlew :flutter_nfc_kit:testDebugUnitTest
        working-directory: example/android

  ios-session-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/flutter_nfc_kit
    steps:
      - uses: actions/checkout@v6
      - run: swift build --target flutter_nfc_kit_session
      - run: swift build --target flutter_nfc_kit_sessionTests
      - run: swift test --skip-build --filter IOSPendingOperationControllerTests
