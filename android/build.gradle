plugins {
    id 'com.android.library'
}

// AGP 9 compiles Kotlin directly when Built-in Kotlin is enabled. Keep the
// legacy plugin for older AGP versions and Flutter's transition mode.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinEnabled = providers.gradleProperty('android.builtInKotlin')
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlinEnabled) {
    pluginManager.apply('kotlin-android')
}

allprojects {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

group = 'im.nfc.flutter_nfc_kit'

android {

    if (project.android.hasProperty("namespace")) {
        namespace = 'im.nfc.flutter_nfc_kit'
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 24
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable += ['InvalidPackage']
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
